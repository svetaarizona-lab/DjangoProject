services:
  web:
    build: .
    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
    - .env
    depends_on:
      db:
        condition: service_healthy

    command: ["sh", "docker-entrypoint.sh"]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydb" ]
      interval: 5s
      timeout: 5s
      retries: 5



  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
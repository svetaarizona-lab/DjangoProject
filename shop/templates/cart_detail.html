<table class="table">
    <tr>
        <th>Book</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Actions</th>
    </tr>

    {% for item in cart %}
    <tr>
        <td>{{ item.book.title }}</td>
        <td>{{ item.book.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ item.total_price }}</td>
        <td>
            <a href="{% url 'cart_remove' item.book.id %}" class="btn btn-danger btn-sm">
                Remove
            </a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5" class="text-center">
            Cart is empty
        </td>
    </tr>
    {% endfor %}
</table>

<hr>

<h4>
    Total: {{ total }}
</h4>
<form method="POST" action="{% url 'checkout_session' %}">
    {% csrf_token %}
 <div class="mb-3">
        <label>Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            placeholder="example@gmail.com"
            required
        >
    </div>

    <button type="submit" class="btn btn-success">
        Pay with Stripe
    </button>
</form>
